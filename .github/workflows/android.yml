# Builds the WA Reach Calls Android app when its code changes.
#
# With the signing key saved as repository secrets (Settings > Secrets and variables > Actions):
#   WA_REACH_KEYSTORE_B64       the .jks key file, base64-encoded
#   WA_REACH_KEYSTORE_PASSWORD  its password
# the APK is signed with the same key as the copy on the phones (so it installs as an update)
# and committed to web/public/downloads, where WA Reach serves it. Without them it is only
# built, to check the code compiles.
name: Android app

on:
  push:
    paths: ['android/**', 'web/public/downloads/**', 'server/services/calls.ts', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'web/public/downloads/**', 'server/services/calls.ts', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.WA_REACH_KEYSTORE_B64 }}
          WA_REACH_KEYSTORE_PASSWORD: ${{ secrets.WA_REACH_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$WA_REACH_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wa-reach-calls.jks"
            export WA_REACH_KEYSTORE="$RUNNER_TEMP/wa-reach-calls.jks"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing key in the repository secrets: building an unsigned APK to check the code."
          fi
          # The tests run the app's screen and sync on simulated Android 8, 10, 13, 14 and 15.
          ./gradlew assembleRelease lintRelease testDebugUnitTest --no-daemon
          rm -f "$RUNNER_TEMP/wa-reach-calls.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: wa-reach-calls
          path: android/app/build/outputs/apk/release/*.apk

      - name: Ship the signed APK with WA Reach
        if: env.SIGNED == 'true' && github.event_name != 'pull_request'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk web/public/downloads/wa-reach-calls.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/downloads/wa-reach-calls.apk
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "WA Reach Calls: rebuilt APK [skip ci]"
          git push

      # Calls → Get the app must hand out the version the server announces (CALL_APP_VERSION), or
      # phones are told about an update that isn't there.
      - name: Check the app WA Reach hands out is the announced version
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          version() { "$AAPT" dump badging "$1" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p"; }
          served=$(version web/public/downloads/wa-reach-calls.apk)
          built=$(version "$(ls android/app/build/outputs/apk/release/*.apk | head -1)")
          announced=$(sed -n "s/.*CALL_APP_VERSION = '\([^']*\)'.*/\1/p" server/services/calls.ts)
          echo "Served: $served, built: $built, announced: $announced"
          if [ "$served" != "$announced" ] || [ "$built" != "$announced" ]; then
            echo "::error::web/public/downloads/wa-reach-calls.apk is $served and the app builds as $built, but the server announces $announced. Rebuild the APK, copy it to web/public/downloads, and keep versionName and CALL_APP_VERSION the same."
            exit 1
          fi
